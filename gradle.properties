# Project-wide Gradle settings.

org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8 -XX:+UseParallelGC
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

# AndroidX is required by every androidx.* dependency used below.
android.useAndroidX=true
# AGP will fail the build if a dependency only ships Kotlin metadata newer than
# the compiler used here - keep this enabled to get an explicit error instead.
android.nonTransitiveRClass=true

# C++ build tuning: ninja keeps the 200+ TU core build snappy and parallel.
android.nativeBuildOutput=verbose
