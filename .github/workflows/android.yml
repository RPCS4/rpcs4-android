# ============================================================================
# RPCS4 Android CI
#
# DISABLED BY DEFAULT (manual dispatch only).
#
# To enable automatic builds on every push + pull request, uncomment the
# `push:` and `pull_request:` blocks under `on:` below.
#
# The workflow builds both debug and release APKs against the rpcs4 submodule.
# Native compilation of the C++ core takes ~20-35 minutes on hosted runners.
# ============================================================================

name: android

on:
   push:
    branches: [ master, main ]
  pull_request:
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Gradle build type'
        required: true
        default: 'debug'
        type: choice
        options:
          - debug
          - release
          - both

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Install Android SDK components
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "ndk;27.0.12077973" \
            "cmake;3.22.1"

      - name: Build APKs
        run: |
          case "${{ github.event.inputs.build_type || 'both' }}" in
            debug)   ./gradlew :app:assembleDebug ;;
            release) ./gradlew :app:assembleRelease ;;
            both)    ./gradlew :app:assembleDebug :app:assembleRelease ;;
          esac

      - name: Upload debug APK
        if: ${{ hashFiles('app/build/outputs/apk/debug/*.apk') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: rpcs4-android-debug
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 30

      - name: Upload release APK
        if: ${{ hashFiles('app/build/outputs/apk/release/*.apk') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: rpcs4-android-release
          path: app/build/outputs/apk/release/*.apk
          retention-days: 30
